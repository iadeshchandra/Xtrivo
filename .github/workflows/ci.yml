# XTRIVO CI — fast correctness gate. Runs on every push to main and every PR.
# Target: green/red signal in ~1 minute (format, typecheck, unit tests).
# All artifact builds (extension zip, web bundle, desktop installers,
# Android APK) run in build-all.yml, which also triggers on every push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  js:
    name: JS/TS — lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm install --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck --workspaces --if-present
      - run: npm run test --workspaces --if-present
